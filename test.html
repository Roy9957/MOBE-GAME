<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOBE - RITUAL SLAUGHTER CHAMBER</title>
  <link rel="canonical" href="https://www.mobe-game.rf.gd/index.html" />
  <link rel="icon" href="https://assets.onecompiler.app/42swzbgaa/433g7msea/1000049145.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Horror Google Fonts: Creepster (Title), Metal Mania (Sections/Buttons), Cinzel (Body) -->
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Metal+Mania&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* HORROR COLOR PALETTE */
    :root {
        --primary: #990000; /* Deep Blood Red */
        --secondary: #100505; /* Blackish Red/Rust */
        --accent: #FF0000; /* Pure Red/Bright Blood */
        --dark: #000000; /* True Black */
        --light: #E0E0E0; /* Pale Grey/Bone */
        --sickly-green: #008000; /* For status/health */
        
        /* Intense, Flickering Glow Effect */
        --glow: 
            0 0 5px var(--primary), 
            0 0 15px var(--primary), 
            0 0 30px var(--accent),
            0 0 45px rgba(255, 0, 0, 0.5); 
    }
    
    /* Keyframes for the Unsettling Flicker */
    @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: var(--glow); opacity: 1; }
        20%, 24%, 55% { text-shadow: none; opacity: 0.8; }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Cinzel', serif; /* Use Cinzel for general text */
      background: radial-gradient(circle at center, var(--secondary) 0%, var(--dark) 90%);
      color: var(--light);
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      filter: grayscale(10%) contrast(150%);
    }
    
    canvas {
      display: block;
      margin: 20px auto;
      border: 3px ridge var(--primary);
      box-shadow: 0 0 30px var(--accent);
      background-color: var(--dark);
      cursor: none; /* Hide default cursor */
    }

    .game-ui {
        width: 100%;
        max-width: 800px;
        padding: 0 20px;
        margin-bottom: 10px;
    }

    /* Score and Info Bar */
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 2px dashed var(--primary);
    }
    
    .score-display, .health-display {
      font-family: 'Metal Mania', cursive;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: var(--light);
      text-shadow: 0 0 10px var(--accent);
    }
    
    .score-value {
      color: var(--sickly-green);
    }

    .health-bar-container {
      width: 150px;
      height: 15px;
      background-color: var(--secondary);
      border: 1px solid var(--primary);
    }

    .health-bar {
      height: 100%;
      background-color: var(--sickly-green);
      transition: width 0.3s;
    }

    /* Game Over Overlay */
    #gameOverScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      display: none; /* Hidden by default */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    #gameOverScreen h1 {
        font-family: 'Creepster', cursive;
        font-size: 5rem;
        color: var(--accent);
        text-shadow: var(--glow);
        animation: flicker 2s infinite alternate;
        margin-bottom: 20px;
    }
    
    #gameOverScreen p {
        font-family: 'Metal Mania', cursive;
        font-size: 1.5rem;
        color: var(--light);
        margin-bottom: 30px;
    }
    
    /* Button Styling */
    .btn {
        padding: 12px 30px;
        margin: 5px;
        border: 2px double var(--light);
        font-family: 'Metal Mania', cursive;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: linear-gradient(135deg, var(--secondary), #200000);
        color: var(--light);
        text-shadow: 0 0 5px var(--primary);
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }
    
    .btn:hover {
        transform: translateY(-2px);
        background: var(--dark);
        color: var(--accent);
        box-shadow: 0 0 20px var(--accent);
        border-color: var(--accent);
    }

    /* Responsive Canvas Container */
    .canvas-wrapper {
        width: 100%;
        max-width: 800px;
        aspect-ratio: 1 / 1; /* Maintain 1:1 ratio */
    }
    
    @media (max-width: 800px) {
        body {
            /* Allow vertical scrolling on small screens if necessary due to fixed UI */
            overflow-y: auto; 
        }
        .canvas-wrapper {
            height: auto;
            max-height: 80vh;
        }
        canvas {
            width: 100%;
            height: auto;
        }
        #gameOverScreen h1 {
            font-size: 3.5rem;
        }
    }
  </style>
</head>
<body>

  <div class="game-ui">
    <div class="info-bar">
        <div class="score-display">
            SLAUGHTER COUNT: <span id="score-value" class="score-value">0</span>
        </div>
        <div class="health-display">
            SANITY:
            <div class="health-bar-container">
                <div id="health-bar" class="health-bar"></div>
            </div>
        </div>
    </div>
  </div>
  
  <div class="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="gameOverScreen">
    <h1>RITUAL FAILED</h1>
    <p>Your Score: <span id="final-score">0</span></p>
    <button id="restart-btn" class="btn"><i class="fas fa-redo-alt"></i> RESTART RITUAL</button>
    <button id="lobby-btn" class="btn"><i class="fas fa-home"></i> RETURN TO LOBBY</button>
  </div>
  
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score-value');
    const healthBarEl = document.getElementById('health-bar');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const lobbyBtn = document.getElementById('lobby-btn');

    // Game state
    let state = {};

    function resetGameState() {
      state = {
        player: { x: canvas.width / 2, y: canvas.height - 50, size: 20, health: 100 },
        bullets: [],
        enemies: [],
        enemyBullets: [],
        explosions: [],
        score: 0,
        gameOver: false,
        lastEnemySpawnTime: 0,
        enemySpawnInterval: 1500,
        enemySpeed: 1.5,
      };
      
      gameOverScreen.style.display = 'none';
      gameLoopId = requestAnimationFrame(gameLoop); // Restart the loop
    }

    // --- Utility Functions ---

    function resizeCanvas() {
        const wrapper = document.querySelector('.canvas-wrapper');
        const size = Math.min(wrapper.clientWidth, wrapper.clientHeight);
        canvas.width = size;
        canvas.height = size;
        
        // Adjust player position if game is active
        if (state.player && !state.gameOver) {
            state.player.x = canvas.width / 2;
            state.player.y = canvas.height - 50;
        } else if (!state.player) {
            // Initial setting
            state.player = { x: canvas.width / 2, y: canvas.height - 50, size: 20, health: 100 };
        }
    }
    
    // Set initial size
    window.onload = () => {
        resizeCanvas();
        resetGameState();
    };
    window.addEventListener('resize', resizeCanvas);

    // --- Input Handling (Touch and Mouse) ---
    
    let isFiring = false;
    let lastFireTime = 0;
    const fireRate = 200; // ms between shots

    function handleInput(e) {
      if (state.gameOver) return;
      
      let clientX;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
      } else if (e.clientX !== undefined) {
        clientX = e.clientX;
      } else {
        return;
      }

      const canvasRect = canvas.getBoundingClientRect();
      const canvasX = clientX - canvasRect.left;

      // Map touch/mouse X position to player X position on the canvas
      state.player.x = Math.max(
        state.player.size / 2, 
        Math.min(canvas.width - state.player.size / 2, canvasX)
      );
    }

    canvas.addEventListener('mousemove', handleInput);
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    canvas.addEventListener('mousedown', () => { isFiring = true; });
    canvas.addEventListener('mouseup', () => { isFiring = false; });
    canvas.addEventListener('touchstart', (e) => { 
        e.preventDefault();
        handleInput(e);
        isFiring = true; 
    }, { passive: false });
    canvas.addEventListener('touchend', () => { isFiring = false; });
    
    // --- Game Logic ---

    function updatePlayer() {
      // Update health bar display
      healthBarEl.style.width = `${state.player.health}%`;
      if (state.player.health <= 0) {
        endGame();
      }
    }

    function playerFire() {
      if (isFiring && (Date.now() - lastFireTime > fireRate)) {
        state.bullets.push({ 
          x: state.player.x, 
          y: state.player.y - state.player.size / 2, 
          size: 4, 
          speed: 8, 
          color: 'var(--sickly-green)' 
        });
        lastFireTime = Date.now();
      }
    }
    
    function spawnEnemy() {
      if (Date.now() - state.lastEnemySpawnTime > state.enemySpawnInterval) {
        const x = Math.random() * (canvas.width - 40) + 20;
        const enemy = {
          x: x,
          y: -20,
          size: 30,
          health: 10 + Math.floor(state.score / 50),
          color: 'var(--primary)',
          lastFireTime: Date.now(),
          fireInterval: 1000 + (Math.random() * 2000),
        };
        state.enemies.push(enemy);
        state.lastEnemySpawnTime = Date.now();
        
        // Increase difficulty
        if (state.enemySpawnInterval > 500) {
            state.enemySpawnInterval -= 10;
        }
        if (state.enemySpeed < 4) {
             state.enemySpeed += 0.005;
        }
      }
    }
    
    function enemyFire() {
      state.enemies.forEach(enemy => {
        if (Date.now() - enemy.lastFireTime > enemy.fireInterval) {
          state.enemyBullets.push({
            x: enemy.x,
            y: enemy.y + enemy.size / 2,
            size: 5,
            speed: 4,
            color: 'var(--accent)',
          });
          enemy.lastFireTime = Date.now();
          // Slightly randomize next fire interval
          enemy.fireInterval = 1000 + (Math.random() * 2000);
        }
      });
    }

    function updateEnemies() {
      state.enemies.forEach(enemy => {
        enemy.y += state.enemySpeed;
      });
      // Filter out enemies that move off-screen
      state.enemies = state.enemies.filter(enemy => enemy.y < canvas.height + enemy.size);
    }
    
    function updateBullets() {
      state.bullets.forEach(bullet => {
        bullet.y -= bullet.speed;
      });
      state.bullets = state.bullets.filter(bullet => bullet.y > 0);

      state.enemyBullets.forEach(bullet => {
        bullet.y += bullet.speed;
      });
      state.enemyBullets = state.enemyBullets.filter(bullet => bullet.y < canvas.height);
    }
    
    function updateExplosions() {
      state.explosions.forEach(explosion => {
        explosion.size += 0.5;
        explosion.opacity -= 0.05;
      });
      state.explosions = state.explosions.filter(explosion => explosion.opacity > 0);
    }

    function checkCollisions() {
      // 1. Player Bullets vs Enemies
      state.bullets = state.bullets.filter(bullet => {
        let hit = false;
        state.enemies = state.enemies.filter(enemy => {
          if (
            bullet.x < enemy.x + enemy.size / 2 &&
            bullet.x > enemy.x - enemy.size / 2 &&
            bullet.y < enemy.y + enemy.size / 2 &&
            bullet.y > enemy.y - enemy.size / 2
          ) {
            // Hit!
            hit = true;
            enemy.health -= 1;
            if (enemy.health <= 0) {
              state.explosions.push({ x: enemy.x, y: enemy.y, size: 10, opacity: 1, color: 'var(--primary)' });
              state.score += 10;
              return false; // Remove enemy
            }
            return true; // Keep enemy
          }
          return true; // Keep enemy
        });
        return !hit; // Remove bullet if it hit
      });
      
      // 2. Enemy Bullets vs Player
      state.enemyBullets = state.enemyBullets.filter(bullet => {
        if (
          bullet.x < state.player.x + state.player.size / 2 &&
          bullet.x > state.player.x - state.player.size / 2 &&
          bullet.y < state.player.y + state.player.size / 2 &&
          bullet.y > state.player.y - state.player.size / 2
        ) {
          // Hit player!
          state.player.health = Math.max(0, state.player.health - 5);
          state.explosions.push({ x: bullet.x, y: bullet.y, size: 5, opacity: 1, color: 'var(--accent)' });
          return false; // Remove bullet
        }
        return true; // Keep bullet
      });
      
      // 3. Enemies vs Player (Melee damage / collision)
      state.enemies = state.enemies.filter(enemy => {
        const dx = state.player.x - enemy.x;
        const dy = state.player.y - enemy.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < (state.player.size + enemy.size) / 2) {
          // Melee hit!
          state.player.health = Math.max(0, state.player.health - 25); // Heavy damage
          state.explosions.push({ x: enemy.x, y: enemy.y, size: 15, opacity: 1, color: 'var(--accent)' });
          state.score += 5; // Small score for close call kill
          return false; // Remove enemy
        }
        return true; // Keep enemy
      });
    }

    function endGame() {
      state.gameOver = true;
      cancelAnimationFrame(gameLoopId);
      finalScoreEl.textContent = state.score;
      gameOverScreen.style.display = 'flex';
    }

    // --- Drawing Functions ---

    function drawPlayer() {
      // Player is a simple triangle (blood cult symbol)
      ctx.fillStyle = 'var(--light)';
      ctx.beginPath();
      ctx.moveTo(state.player.x, state.player.y - state.player.size / 2);
      ctx.lineTo(state.player.x - state.player.size / 2, state.player.y + state.player.size / 2);
      ctx.lineTo(state.player.x + state.player.size / 2, state.player.y + state.player.size / 2);
      ctx.closePath();
      ctx.fill();
      
      // Add a small red glow to the player
      ctx.shadowColor = 'var(--accent)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'var(--accent)';
      ctx.beginPath();
      ctx.arc(state.player.x, state.player.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0; // Reset shadow for other drawings
    }
    
    function drawEnemies() {
      state.enemies.forEach(enemy => {
        ctx.fillStyle = enemy.color;
        
        // Enemy is a square/box (the ancient horror)
        ctx.fillRect(
          enemy.x - enemy.size / 2, 
          enemy.y - enemy.size / 2, 
          enemy.size, 
          enemy.size
        );
        
        // Draw health indicator (deep red)
        const healthRatio = enemy.health / (10 + Math.floor(state.score / 50));
        ctx.fillStyle = 'rgba(153, 0, 0, 0.8)'; // Darker Red
        ctx.fillRect(enemy.x - enemy.size / 2, enemy.y - enemy.size / 2 - 5, enemy.size, 3);
        ctx.fillStyle = 'var(--accent)'; // Bright Red for remaining health
        ctx.fillRect(enemy.x - enemy.size / 2, enemy.y - enemy.size / 2 - 5, enemy.size * healthRatio, 3);
      });
    }

    function drawBullets() {
      // Player Bullets (Sickly Green)
      state.bullets.forEach(bullet => {
        ctx.fillStyle = bullet.color;
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Enemy Bullets (Bright Red)
      state.enemyBullets.forEach(bullet => {
        ctx.fillStyle = bullet.color;
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawExplosions() {
      state.explosions.forEach(explosion => {
        ctx.save();
        ctx.globalAlpha = explosion.opacity;
        ctx.fillStyle = explosion.color;
        ctx.beginPath();
        ctx.arc(explosion.x, explosion.y, explosion.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }
    
    function drawScore() {
      scoreEl.textContent = state.score;
    }
    
    function drawBackground() {
      // Subtle background refresh to create a trail effect
      ctx.fillStyle = 'rgba(10, 10, 10, 0.1)'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw starfield (white/light particles)
      ctx.fillStyle = 'var(--light)';
      for (let i = 0; i < 100; i++) {
        // Simple star pattern with vertical movement for atmosphere
        const x = Math.random() * canvas.width;
        // Use modulus to wrap the stars vertically
        const y = (Math.random() * canvas.height + (Date.now() * 0.01)) % canvas.height; 
        const size = Math.random() * 1.5;
        ctx.fillRect(x, y, size, size);
      }
    }
    
    // Main game loop
    let gameLoopId;
    function gameLoop() {
      if (state.gameOver) return;
      
      drawBackground();
      spawnEnemy();
      updatePlayer();
      playerFire();
      enemyFire();
      updateBullets();
      updateEnemies();
      updateExplosions();
      checkCollisions();
      
      drawEnemies();
      drawBullets();
      drawExplosions();
      drawPlayer(); // Draw player last to ensure visibility
      drawScore();
      
      gameLoopId = requestAnimationFrame(gameLoop);
    }
    
    // --- Event Listeners ---
    restartBtn.addEventListener('click', () => {
        resizeCanvas(); // Ensure canvas size is correct before restart
        resetGameState();
    });
    
    lobbyBtn.addEventListener('click', () => {
        window.location.href = 'lobby.html';
    });
    
  </script>
</body>
</html>
